name: Run job scrapers and publish database

on:
  workflow_dispatch:
    inputs:
      time_limit_hours:
        description: "Scrape time limit per job, in hours (use 0.1 for a quick test)"
        required: false
        default: "5.0"
  schedule:
    # Every day at 12:17 UTC
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: job-scrapers
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # GitHub-hosted runners are hard-capped at 6 hours per job.
    timeout-minutes: 360

    strategy:
      # One part failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          # Action 1: these run one after another, in this order.
          - part: main
            scrapers: "ashby bamboohr greenhouse icims lever"
          # Action 2: Workday gets its own runner and its own 6 hour cap.
          - part: workday
            scrapers: "workday"

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape (partial results allowed), then parse locations
        env:
          # Leaves about an hour of the 6 hour cap for location parsing,
          # the snapshot, zipping and uploading. Tune after the first run.
          SCRAPE_TIME_LIMIT_HOURS: ${{ inputs.time_limit_hours || '5.0' }}
          SCRAPERS: ${{ matrix.scrapers }}
        run: python .github/workflows/github_main.py --scrapers $SCRAPERS

      - name: Create consistent database snapshot
        env:
          PART: ${{ matrix.part }}
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          part = os.environ["PART"]
          source_path = Path("The_Database/job_data.db")

          if not source_path.is_file():
              raise FileNotFoundError(
                  f"No database exists at {source_path}"
              )

          output = Path("artifacts")
          output.mkdir(exist_ok=True)
          snapshot_path = output / f"job_data_{part}.db"

          source = sqlite3.connect(
              source_path.resolve().as_uri() + "?mode=ro",
              uri=True,
          )
          destination = sqlite3.connect(snapshot_path)

          try:
              source.backup(destination)

              results = [
                  row[0]
                  for row in destination.execute(
                      "PRAGMA integrity_check"
                  )
              ]

              if results != ["ok"]:
                  raise RuntimeError(
                      f"Database integrity check failed: {results}"
                  )
          finally:
              destination.close()
              source.close()

          print(
              f"Database snapshot created: "
              f"{snapshot_path.stat().st_size:,} bytes"
          )
          PY

      - name: Compress database and check release size
        env:
          PART: ${{ matrix.part }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          part = os.environ["PART"]
          database_path = Path(f"artifacts/job_data_{part}.db")
          zip_path = Path(f"artifacts/job_data_{part}.zip")

          with ZipFile(
              zip_path,
              mode="w",
              compression=ZIP_DEFLATED,
              compresslevel=6,
              allowZip64=True,
          ) as archive:
              archive.write(database_path, arcname=database_path.name)

          size = zip_path.stat().st_size
          limit = 2 * 1024**3

          print(
              f"Compressed database: {size:,} bytes "
              f"({size / 1024**3:.2f} GiB)"
          )

          if size >= limit:
              raise RuntimeError(
                  "The ZIP is too large for a single release asset "
                  "(2 GiB limit). No release will be published for this part."
              )

          database_path.unlink()
          PY

      - name: Upload zipped database for publishing
        uses: actions/upload-artifact@v4
        with:
          name: job-data-${{ matrix.part }}
          path: artifacts/job_data_${{ matrix.part }}.zip
          if-no-files-found: error
          # The zip is already compressed, so don't compress it again.
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish release
    needs: scrape
    # Publish whatever succeeded, even if one part failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download zipped databases
        uses: actions/download-artifact@v4
        with:
          pattern: job-data-*
          merge-multiple: true
          path: artifacts

      - name: Check that there is something to publish
        run: |
          ls -lh artifacts
          if ! ls artifacts/*.zip >/dev/null 2>&1; then
            echo "No database zips were produced; nothing to publish."
            exit 1
          fi

      - name: Publish database release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DATE="$(date -u +%F)"
          TAG="database-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FILES="$(cd artifacts && ls *.zip | tr '\n' ' ')"

          cat > release-notes.md <<EOF
          Automated job database checkpoint, split into separate databases.

          Files in this release: ${FILES}

          - job_data_main.zip: Ashby, BambooHR, Greenhouse, iCIMS, Lever
          - job_data_workday.zip: Workday

          If one of these is missing, that part failed in this run.

          ## How to use

          1. Download the zip files and extract each .db file.
          2. Every .db file has the same schema but its own IDs, so they
             must be merged into one database rather than copied over each other.
          3. Back up your existing database before replacing it.

          Snapshot date: ${DATE} UTC
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          gh release create "$TAG" \
            artifacts/*.zip \
            --target "$GITHUB_SHA" \
            --title "${DATE} Database Snapshot" \
            --notes-file release-notes.md \
            --latest